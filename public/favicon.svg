<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Glossy black button body -->
    <radialGradient id="btn" cx="32%" cy="26%" r="90%">
      <stop offset="0%" stop-color="#41414b"/>
      <stop offset="40%" stop-color="#17171d"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <!-- Outer metallic rim -->
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c5c66"/>
      <stop offset="40%" stop-color="#2a2a31"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <!-- Gloss overlay -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="60%" y2="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Chrome border for keyboard -->
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f2f4f7"/>
      <stop offset="38%" stop-color="#c6cbd4"/>
      <stop offset="65%" stop-color="#7d8491"/>
      <stop offset="100%" stop-color="#4c525c"/>
    </linearGradient>
    <!-- Key gradient -->
    <linearGradient id="key" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9aa1ac"/>
      <stop offset="55%" stop-color="#565d68"/>
      <stop offset="100%" stop-color="#2e333b"/>
    </linearGradient>
    <!-- Metallic STuZ text -->
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f0f2f5"/>
      <stop offset="50%" stop-color="#8f96a1"/>
      <stop offset="62%" stop-color="#dde1e7"/>
      <stop offset="100%" stop-color="#565d69"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="circle">
      <circle cx="256" cy="256" r="234"/>
    </clipPath>
  </defs>

  <!-- Button body -->
  <circle cx="256" cy="256" r="236" fill="url(#btn)"/>

  <!-- Outer bevel rim -->
  <circle cx="256" cy="256" r="234" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <circle cx="256" cy="256" r="228" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Top-left gloss highlight -->
  <g clip-path="url(#circle)">
    <ellipse cx="176" cy="150" rx="175" ry="120" fill="url(#gloss)" filter="url(#soft)" transform="rotate(-22 176 150)"/>
    <ellipse cx="168" cy="104" rx="95" ry="52" fill="#ffffff" fill-opacity="0.22" filter="url(#soft)" transform="rotate(-18 168 104)"/>
  </g>

  <!-- Sparkle (four-point star) top-left -->
  <path d="M152 82 C155 94 166 105 178 108 C166 111 155 122 152 134 C149 122 138 111 126 108 C138 105 149 94 152 82 Z" fill="#ffffff" opacity="0.95"/>

  <!-- Keyboard icon (metallic, angled) -->
  <g transform="rotate(-5 256 170)">
    <!-- Body chrome border -->
    <rect x="181" y="116" width="150" height="100" rx="14" fill="#15171c" stroke="url(#chrome)" stroke-width="3.5"/>
    <!-- Top bevel highlight -->
    <rect x="185" y="120" width="142" height="4" rx="2" fill="#ffffff" fill-opacity="0.35"/>
    <!-- Row 1 -->
    <g>
      <rect x="199" y="132" width="18" height="11" rx="2.5" fill="url(#key)"/>
      <rect x="222" y="132" width="18" height="11" rx="2.5" fill="url(#key)"/>
      <rect x="245" y="132" width="18" height="11" rx="2.5" fill="url(#key)"/>
      <rect x="268" y="132" width="18" height="11" rx="2.5" fill="url(#key)"/>
      <rect x="291" y="132" width="18" height="11" rx="2.5" fill="url(#key)"/>
    </g>
    <!-- Row 2 -->
    <g>
      <rect x="199" y="148" width="18" height="11" rx="2.5" fill="url(#key)"/>
      <rect x="222" y="148" width="18" height="11" rx="2.5" fill="url(#key)"/>
      <rect x="245" y="148" width="18" height="11" rx="2.5" fill="url(#key)"/>
      <rect x="268" y="148" width="18" height="11" rx="2.5" fill="url(#key)"/>
      <rect x="291" y="148" width="18" height="11" rx="2.5" fill="url(#key)"/>
    </g>
    <!-- Row 3 (spacebar row) -->
    <g>
      <rect x="199" y="164" width="18" height="11" rx="2.5" fill="url(#key)"/>
      <rect x="222" y="164" width="60" height="11" rx="3" fill="url(#key)"/>
      <rect x="287" y="164" width="18" height="11" rx="2.5" fill="url(#key)"/>
      <rect x="310" y="164" width="14" height="11" rx="2.5" fill="url(#key)"/>
    </g>
    <!-- Bottom bevel shadow -->
    <rect x="185" y="210" width="142" height="2" rx="1" fill="#000000" fill-opacity="0.5"/>
  </g>

  <!-- STuZ metallic text -->
  <text x="256" y="402" font-family="'Arial Black','Arial','Helvetica',sans-serif" font-size="116" font-style="italic" font-weight="900" fill="url(#metal)" text-anchor="middle" letter-spacing="2">STuZ</text>
</svg>
